global:
  random_seed: 42
  init_explore_size: 10
  loss_threshold: 0.1
  max_train_steps: 100
  selection_strategies:
    - 'EpsilonGreedy'
    - 'Greedy'
  importance_strategies:
    - 'EMA'
    - 'MaxMean'
  selection_strategy_params:
    epsilon: 0.2
  importance_strategy_params:
    lambda_param: 1.0
    mu: 1.0
    alpha: 0.8
    mean_type: 'geometric'
  trainer:
    batch_size: 32
    learning_rate: 0.01
    epochs: 10
    test_size: 0.2

subtasks:
  - name: "DebugSubtask1"
    model_path: "models/debug_model1.pth"
    data_path: "data/debug_dataset1.csv"
    log_dir: "logs/debug_subtask1"
    is_dynamic: false
    initial_importance: 1.0
    sampling_time: 50

  - name: "DebugSubtask2"
    model_path: "models/debug_model2.pth"
    data_path: "data/debug_dataset2.csv"
    log_dir: "logs/debug_subtask2"
    is_dynamic: true
    initial_importance: 0.8
    sampling_time: 25